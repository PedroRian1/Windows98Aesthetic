<!DOCTYPE html>
<html>
    <head>
    <title>Windows 98 aesthetics</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Um site com estética do windows 98">
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <img src="assets/floppy_drive_5_25_cool-0.png" alt="Ícone Sistema" width="90" height="90">
            <div class="title-bar">
            <h1 class="title-bar-text">Windows 98 aesthetics</h1>
 
            <div class="title-bar-controls">
                <button class="win-btn" aria-label="Minimizar">-</button>
                <button class="win-btn" aria-label="Maximar">🗖</button>
                <button class="win-btn win-btn-close" aria-label="Fechar">X</button>
            </div> 
            </div>
        <ul>
            <li><u>A</u>Arquivo</li>
            <li><u>E</u>Editar</li>
            <li><u>E</u>Exibir</li>
            <li><u>F</u>Favoritos</li>   
            <li><u>A</u>Ajuda</li>     
        </ul>
        </header>
        <main>
            <div class="desktop">
                <div class="curiosity-panel">
                    <p>
                        Selecione um tópico para mostrar uma curiosidade sobre o Windows 98.
                    </p>

                    <div class="buttons-grid">
                        <button class="curiosity-trigger" data-id="1"><img src="assets/calendar-0.png" alt="calendário" width="13"> Curiosidade 01: O Som de Inicialização</button>
                        <button class="curiosity-trigger" data-id="2"><img src="assets/camera3-2.png" alt="camera" width="13"> Curiosidade 02: O codinome secreto </button>
                        <button class="curiosity-trigger" data-id="3"><img src="assets/cd_audio_cd_a-4.png" alt="CD-audio" width="13"> Curiosidade 03: Requisitos de Sistema</button>
                        <button class="curiosity-trigger" data-id="4"><img src="assets/clean_drive-4.png" alt="clean-drive" width="13"> Curiosidade 04: O Easter Egg na tela de créditos</button>
                        <button class="curiosity-trigger" data-id="5"><img src="assets/computer-4.png" alt="computador" width="13"> Curiosidade 05: A famosa "Tela Azul" ao vivo</button>
                        <button class="curiosity-trigger" data-id="6"><img src="assets/directory_closed_cool-0.png" alt="pasta" width="13"> Curiosidade 06: Integração com a Internet</button>
                        <button class="curiosity-trigger" data-id="7"><img src="assets/msie1-2.png" alt="internet-explore" width="13"> Curiosidade 07: O mistério dos Temas de Desktop</button>
                        <button class="curiosity-trigger" data-id="8"><img src="assets/network_internet_pcs_installer-2.png" alt="conexão-computadores" width="13"> Curiosidade 08: Jogos Nativos Inesquecíveis</button>
                        <button class="curiosity-trigger" data-id="9"><img src="assets/recycle_bin_empty-4.png" alt="lixeira" width="13"> Curiosidade 09: O fim do suporte oficial</button>
                        <button class="curiosity-trigger" data-id="10"><img src="assets/windows_update_large-2.png" alt="windows-icon" width="13px"> Curiosidade 10: O verdadeiro sucessor </button>
                    </div>
                </div>

                <div id="curiosity-window" class="window">

                    <div class="title-bar">
                        <span class="title-bar-text">Fato Curioso.txt</span>
                        <div class="title-bar-controls">
                            <button id="close-window-btn" >X</button>
                        </div>
                    </div>
                    <div class="window-body">
                        <p id="curiosity-text"> A curiosidade aparecerá aqui...</p>

                        <div>
                            <button id="ok-window-btn">Ok</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="taskbar">
             <div class="taskbar-left">
                <button id="start-button">
                    💻 Iniciar
                </button>
                <div>
                    <div id="taskbar-app">
                        <button class="app-tab">
                            📄 Fato Curioso.txt
                        </button>
                    </div>
                </div>
                <div class="system-tray">
                    <span>🔊</span>
                    <span id="clock-display">
                        12:00
                    </span>
                </div>
             </div>
        </footer>
    </body>
</html>
